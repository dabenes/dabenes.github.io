name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_OWNER_NAME: ${{ vars.NUXT_PUBLIC_OWNER_NAME }}
      NUXT_PUBLIC_OWNER_NICK: ${{ vars.NUXT_PUBLIC_OWNER_NICK }}
      NUXT_PUBLIC_GITHUB_URL: ${{ vars.NUXT_PUBLIC_GITHUB_URL }}
      NUXT_PUBLIC_LINKEDIN_URL: ${{ vars.NUXT_PUBLIC_LINKEDIN_URL }}
      NUXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NUXT_PUBLIC_CONTACT_EMAIL }}
      NUXT_PUBLIC_SITE_TITLE: ${{ vars.NUXT_PUBLIC_SITE_TITLE }}
      NUXT_PUBLIC_API_BASE_URL: ${{ vars.NUXT_PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
